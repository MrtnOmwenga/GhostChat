services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      MONGODB_URI: mongodb://mongo:27017/ghostchat
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5000
      # Plain HTTP on localhost; set to true when a TLS proxy sits in front.
      SECURE_COOKIES: "false"
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine

volumes:
  mongo-data:
